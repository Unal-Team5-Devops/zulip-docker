name: AWS infra

# Plan de la infraestructura AWS en cada PR que toque terraform/aws. Las
# credenciales salen de OIDC: GitHub firma un token para este job y AWS lo
# cambia por credenciales temporales de un rol de solo lectura. No hay llaves
# de acceso guardadas en el repositorio.
# El apply lo hace un integrante tras revisar el plan (ver docs/DEPLOY-AWS.md):
# la instancia es el entorno vivo y un reemplazo accidental lo apagaría.
on:
  pull_request:
    paths:
      - "terraform/aws/**"
      - ".github/workflows/aws-infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.6"
  AWS_REGION: us-east-2

defaults:
  run:
    working-directory: terraform/aws

jobs:
  plan:
    runs-on: ubuntu-latest
    # Sin las variables del repositorio (antes del primer apply) no hay rol que asumir.
    if: vars.AWS_PLAN_ROLE_ARN != ''
    env:
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"
      - name: terraform plan
        run: terraform plan -no-color | tee plan.txt
      - uses: actions/upload-artifact@v7
        with:
          name: aws-plan
          path: terraform/aws/plan.txt
          retention-days: 14
