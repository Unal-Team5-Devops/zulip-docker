global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: zulip
    environment: workshop
rule_files: ["/etc/prometheus/rules.yml"]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: zulip
    static_configs:
      - targets: ["collector:9105"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
