global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/slo-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # RabbitMQ expone métricas nativas mediante rabbitmq_prometheus en 15692.
  # El endpoint permanece dentro de la red backend.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: zulip-blackbox
    metrics_path: /probe
    params:
      module: [zulip_https]
      # DNS interno Docker: "zulip"; Host/SNI público configurado en Zulip.
      hostname: [zulip.localhost]
    static_configs:
      - targets:
          - https://zulip/api/v1/server_settings
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
