global:
  resolve_timeout: 1m
route:
  receiver: operational-log
  group_by: [alertname, slo]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: operational-log
    webhook_configs:
      - url: http://alert-receiver:8080/alerts
        send_resolved: true
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [slo]
