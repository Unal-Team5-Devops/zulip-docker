services:
  zulip:
    image: ${ZULIP_IMAGE:-ghcr.io/unal-team5-devops/zulip-docker:sha-2699602}
    environment:
      SETTING_USE_X_FORWARDED_HOST: 'True'
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS --max-time 5 -H \"Host: $$SETTING_EXTERNAL_HOST\" https://127.0.0.1/api/v1/server_settings > /dev/null"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 180s
  rabbitmq:
    command:
      - sh
      - -euc
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat $$RABBITMQ_PASSWORD_FILE)"
        rabbitmq-plugins enable --offline rabbitmq_prometheus
        exec docker-entrypoint.sh rabbitmq-server
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [frontend, monitoring]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./observability/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./observability/.local/tls:/etc/nginx/tls:ro
      - gateway-logs:/var/log/telemetry
    depends_on:
      zulip: {condition: service_healthy}
  collector:
    build: ./observability/collector
    restart: unless-stopped
    networks: [monitoring, backend]
    environment:
      POSTGRES_HOST: database
      REDIS_HOST: redis
      MEMCACHED_HOST: memcached
      RABBITMQ_METRICS: http://rabbitmq:15692/metrics
    secrets: [zulip__postgres_password, zulip__redis_password, zulip__memcached_password]
    volumes:
      - gateway-logs:/logs:ro
    depends_on:
      database: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    networks: [monitoring, backend]
    ports: ["127.0.0.1:9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    networks: [monitoring]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/zulip-sre.json
    secrets: [grafana_admin_password]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    networks: [monitoring]
    ports: ["127.0.0.1:9093:9093"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
  alert-receiver:
    build: ./observability/collector
    command: ["python", "receiver.py"]
    restart: unless-stopped
    networks: [monitoring]
    volumes: ["alert-events:/events"]
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    command: ["--docker_only=true", "--store_container_labels=false", "--housekeeping_interval=15s"]
    restart: unless-stopped
    privileged: true
    networks: [monitoring]
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd:/run/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
networks:
  monitoring:
volumes:
  gateway-logs:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  alert-events:
secrets:
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
